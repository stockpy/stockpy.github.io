---
layout: default
---

<div class="archive">
  <h1>Archive - {{ page.year }}</h1>
  
  <ul class="post-list">
    {% for post in site.posts %}
      {% if post.date | date: "%Y" == page.year %}
        <li>
          <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
          <a href="{{ post.url }}">{{ post.title }}</a>
        </li>
      {% endif %}
    {% endfor %}
  </ul>
</div>
